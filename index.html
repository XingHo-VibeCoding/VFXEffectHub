<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>VFXEffectHub · 主视图</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <header class="site-header site-header--home">
    <div class="brand">
      <h1 class="site-title">VFXEffectHub</h1>
      <p class="site-subtitle">游戏特效素材参考收集 · Unity / UE / 贴图</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="分区切换">
    <button class="tab is-active" role="tab" aria-selected="true" data-tab="unity">Unity</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="ue">UE</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="texture">贴图</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="collections">我的收藏</button>
  </nav>

  <main class="container">
    <div class="toolbar toolbar--home" role="toolbar" aria-label="筛选工具栏">
      <input id="searchInput" type="search" class="toolbar__search" placeholder="搜索标题或标签…" aria-label="搜索">
      <select id="gameFilter" class="toolbar__select" aria-label="按游戏名筛选">
        <option value="">游戏名：全部</option>
      </select>
      <select id="effectFilter" class="toolbar__select" aria-label="按特效类型筛选">
        <option value="">特效类型：全部</option>
      </select>
      <button id="errorBtn" type="button" class="btn btn--ghost" aria-label="模拟错误态">模拟错误</button>
    </div>

    <div id="statusArea" class="status" aria-live="polite"></div>
    <section id="grid" class="grid" aria-label="作品瀑布流"></section>
  </main>

  <footer class="site-footer">
    <p>作品由编辑者收录 · 收录入口不对公众开放</p>
  </footer>

  <script src="js/home.js"></script>
</body>
</html>
